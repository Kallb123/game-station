name: zibo_games
description: >-
  A local, offline, ad-free games app for children: deterministic Sudoku and
  retro arcade games, with progress that persists across sessions.
publish_to: none

# The build number is bumped per store submission, the version per release.
version: 0.3.0+5

environment:
  sdk: ^3.12.2

# Dependencies arrive with the phase that needs them: flame and flutter_riverpod
# in phases 1 and 4, path_provider in phase 1, minisound in phase 5.
#
# Nothing that talks to a network, shows an ad, or reports a crash may be added
# here — `tool/check_offline.dart` fails the build if one appears, including
# transitively through pubspec.lock.
dependencies:
  # The arcade's game loop, viewport letterboxing and `GameWidget` bridge
  # (`PLAN-phase-4.md` §1, §3). Adds exactly two packages to the resolved
  # graph — itself and `ordered_set` — neither in `tool/check_offline.dart`'s
  # network or forbidden lists; `vector_math` and `meta` were already pulled
  # in through Flutter. `InvadersSim` (`features/arcade/invaders/model/`)
  # holds all of the game's own state and imports none of this.
  flame: ^1.38.0
  flutter:
    sdk: flutter
  # State and dependency injection (PLAN.md §2). Pinned to 2.x rather than 3.x:
  # riverpod 3 depends on `package:test`, which drags shelf, web_socket_channel
  # and web_socket into the resolved graph. They are unreachable at runtime, but
  # `tool/check_offline.dart` reads the graph rather than trusting reachability,
  # and weakening that check to admit a state library is the wrong trade.
  flutter_riverpod: ^2.6.1
  # Playback on all six targets from one MIT package, with `miniaudio` vendored
  # in `minisound_ffi` rather than fetched at build time (`PLAN.md` §2,
  # `PLAN-phase-5.md` §3.1). Not `flutter_soloud`, which resolves `http` into
  # the shipped graph at every version and fails `tool/check_offline.dart`.
  # `minisound_ffi`'s own manifest declares `RECORD_AUDIO` for a recorder this
  # app never uses; `android/app/src/main/AndroidManifest.xml` removes it with
  # `tools:node="remove"` (`PLAN-phase-5.md` §3.2).
  minisound: ^3.0.1
  # Resolves the per-platform application support directory, which is where
  # `save.json` lives. It is the only way to get that path without hard-coding
  # five platform conventions, and it reaches no network: the plugin is a thin
  # call into each platform's own path API.
  path_provider: ^2.1.5
  puzzle_engine:
    path: ../packages/puzzle_engine

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Runs `integration_test/` on a real device (PLAN-phase-3.md §6, PR 9). A dev
  # dependency, so nothing it drags in reaches a release build: it brings a
  # driver HTTP client with it, which `tool/check_offline.dart` reports as
  # test-only rather than shipped because it is unreachable from the runtime
  # dependencies. CI does not run these tests — see AGENTS.md.
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Assets are declared as each phase adds real files. An asset directory that
  # is declared but empty fails the build, and `assets/*/.gitkeep` alone does
  # not count as content.
  #
  # assets:
  #   - assets/images/
  assets:
    - assets/audio/sudoku/
    - assets/audio/arcade/

  # Fonts are bundled rather than fetched: google_fonts downloads at runtime,
  # which the no-network rule rules out. See assets/fonts/README.md.
