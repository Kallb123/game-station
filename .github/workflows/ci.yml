name: CI

on:
  # Pushes to main and pull requests, not every branch push: a branch with an
  # open PR would otherwise run the whole workflow twice for one commit, and the
  # two runs differ only in which ref they check out.
  #
  # Documentation is skipped because nothing below reads it. check_offline.dart
  # scans .dart files, the platform manifests and the resolved dependency graph;
  # check_determinism.dart scans the engine's lib/; the Flutter pin is read from
  # this file rather than from a document. A commit touching only Markdown or
  # the licence cannot turn any of them red, and it costs five build jobs to
  # find that out — two of them on macOS and Windows minutes.
  #
  # Two consequences, both deliberate. A docs-only push to main leaves main's
  # last CI run pointing at the last commit that carried code, which is the
  # commit it was measuring anyway. And a pull request that changes only docs
  # gets no checks at all: fine while main is unprotected, but if these jobs
  # ever become required checks, a skipped one stays pending forever and blocks
  # the merge — at which point this needs a companion workflow reporting the
  # same job names, not the deletion of the filter.
  #
  # Paths are repeated rather than shared through a YAML anchor: the Actions
  # parser does not expand anchors, so an alias here would silently filter
  # nothing.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than tracking stable: a toolchain that changes underneath the
  # puzzle generator is exactly what the determinism tests exist to catch, so
  # the version moves deliberately, in its own commit.
  FLUTTER_VERSION: 3.44.9

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: |
          (cd packages/puzzle_engine && dart pub get)
          (cd app && flutter pub get)

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze puzzle_engine
        run: dart analyze --fatal-infos --fatal-warnings
        working-directory: packages/puzzle_engine

      - name: Analyze app
        run: flutter analyze
        working-directory: app

      - name: Analyze tool scripts
        run: dart analyze --fatal-infos --fatal-warnings tool

      # FUZZ_SEEDS is how many puzzles the fuzz generates across every size and
      # difficulty; tool/verify.sh sets the same 2000, so what blocks a merge
      # and what people run locally are one check rather than two. The goldens
      # in the same suite are compared unconditionally: they are the promise
      # that a saved puzzle ID still names the grid it named when it was saved.
      - name: Test puzzle_engine
        run: dart test
        working-directory: packages/puzzle_engine
        env:
          FUZZ_SEEDS: 2000

      # PLAN.md §3.5's targets, measured rather than asserted in review. The
      # ceiling is three times the target and applies to the median, because a
      # shared runner varies by more than a factor of two and a check that goes
      # red when the runner is busy is a check somebody deletes. An
      # order-of-magnitude regression is what this catches; the tail is the
      # fuzz's 2 s per-puzzle ceiling above.
      - name: Benchmark the generator
        run: dart run tool/benchmark.dart
        working-directory: packages/puzzle_engine

      # The PRNG and the hash mask every operation to 32 bits so that a
      # JavaScript number — exact only to 53 bits — produces the same puzzles as
      # a 64-bit VM. Compiling those two files with dart2js and running them in
      # Chrome is what checks that; review cannot. ubuntu-latest ships Chrome,
      # so no browser setup step is needed. See PLAN-phase-2.md §1.
      - name: Test the engine on the web platform
        run: dart test -p chrome test/rng_test.dart test/hash_test.dart
        working-directory: packages/puzzle_engine

      - name: Test app
        run: flutter test
        working-directory: app

      # The project's promises are enforced here rather than by convention:
      # no networking APIs or URLs in shipped code, no ad, analytics or HTTP
      # package in the runtime dependency graph, no INTERNET permission in the
      # release manifest, no network entitlement on macOS. See PLAN.md §2.
      #
      # The guard is tested before it is trusted: its source scanner has to tell
      # a URL in a comment from one in a string literal, and a scanner that
      # silently loses track reports nothing while looking like it passed.
      - name: Test the offline check
        run: dart tool/check_offline.dart --self-test

      - name: Check the offline, no-ads, no-tracking constraints
        run: dart tool/check_offline.dart

      # Saves store puzzle IDs rather than grids, so a generator that reads a
      # clock, draws from dart:math or iterates a map produces a different
      # puzzle for the same ID later — quietly, on someone else's device. The
      # golden files (phase 2 PR 6) catch the effect; this catches the cause at
      # the line that introduced it. Its own scanner is tested first, for the
      # same reason the offline check's is.
      - name: Test the determinism check
        run: dart tool/check_determinism.dart --self-test

      - name: Check the engine determinism rules
        run: dart tool/check_determinism.dart

  # The Android leg lives in its own workflow so the same build can be run on
  # demand, and so the APK CI checks is the one people install. It asserts that
  # the built package requests no platform permission — the source-level check
  # above reads the manifest, that one reads the artifact — and uploads it.
  #
  # The signing secrets are passed through because the APK people install is
  # this one: signed with the same key every run, a CI build installs over the
  # last one instead of demanding an uninstall. Named one by one rather than
  # `secrets: inherit`, which would hand the build every secret the repository
  # ever gains. A pull request from a fork is given none of them and falls back
  # to the debug key, which builds and installs but not over anything.
  build-android:
    name: Build Android
    uses: ./.github/workflows/android-apk.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Runners occasionally hang fetching archive.ubuntu.com over a flaky
      # IPv6 route instead of failing or falling back to IPv4, stalling on
      # an InRelease download until the job timeout. Forcing IPv4 avoids the
      # bad route, the retry/timeout options turn a stall into a quick
      # failure, and timeout-minutes is the backstop if it stalls anyway.
      - name: Install the Linux desktop toolchain
        timeout-minutes: 5
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=10 \
            -o Acquire::https::Timeout=10
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app
      - run: flutter build linux --debug
        working-directory: app

  # macOS and Windows runners cost several times an Ubuntu minute, so they run
  # on main and on request rather than on every branch push. iOS is built
  # without signing, which is as far as CI can go without a paid account.
  build-apple:
    name: Build iOS and macOS
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app
      - run: flutter build ios --debug --no-codesign
        working-directory: app
      - run: flutter build macos --debug
        working-directory: app

  build-windows:
    name: Build Windows
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --debug
        working-directory: app
