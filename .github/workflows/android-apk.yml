name: Android APK

# Builds the release APKs and keeps them: CI needed the build to prove the app
# compiles and requests no permissions, and threw the package away. This one
# uploads it, so a phone can be handed a build without a store account and
# without a local Flutter install.
#
# Two flavours are built on every run (PLAN-phase-10-quiz.md §4.9): `store`,
# the public build, and `private`, which also bundles the private quiz packs
# for the family's tablets. The store APK is what is uploaded, released and
# installed widely; the private one is uploaded only on request.
#
# It is the same build either way — CI and the release workflow both call this
# one rather than running their own `flutter build apk`, so the artifact people
# install is byte-for-byte the one the pull request checked.
on:
  # Build on request, from any branch or tag, via the Actions tab.
  workflow_dispatch:
    inputs:
      private:
        description: Also upload the private APK, for Amazon Live App Testing
        type: boolean
        default: false
  # And as the Android leg of CI, and of android-release.yml. No inputs: the
  # Flutter pin is read from ci.yml below, because `env` is not in scope for a
  # called workflow's inputs and a second copy of the pin is a second thing to
  # forget.
  #
  # No paths filter here, and adding one would do nothing: this workflow never
  # triggers on a push, so what decides whether it runs is the caller's filter —
  # ci.yml skips documentation, and this leg skips with it.
  workflow_call:
    # The signing key, which a caller has to pass through explicitly — a called
    # workflow sees no secret it was not handed. All four are optional so that a
    # repository, fork or branch without them still builds; the build falls back
    # to the debug key and the summary says so.
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
        description: The signing keystore, base64-encoded.
      ANDROID_KEYSTORE_PASSWORD:
        required: false
        description: Password for the keystore itself.
      ANDROID_KEY_ALIAS:
        required: false
        description: Alias of the key inside the keystore.
      ANDROID_KEY_PASSWORD:
        required: false
        description: Password for that key. Often the same as the keystore's.
    outputs:
      apk:
        description: >-
          Name of the uploaded artifact, which is also the APK's file name
          without its extension.
        value: ${{ jobs.build.outputs.apk }}

# A newer push to the same branch makes the older build irrelevant. The caller's
# name is in the group so a hand-triggered build and the CI leg for the same ref
# do not cancel each other: `github.workflow` is the calling workflow's name
# when this runs via workflow_call.
concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.apk.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      # One pinned version for the whole project, read rather than copied — the
      # same single home that tool/install_flutter.sh reads. See README.md.
      - name: Read the pinned Flutter version
        id: pin
        run: |
          version=$(sed -n 's/^ *FLUTTER_VERSION: *//p' .github/workflows/ci.yml | head -1)
          if [ -z "$version" ]; then
            echo 'Could not read FLUTTER_VERSION from .github/workflows/ci.yml' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Flutter $version"

      # `cache: gradle` keeps ~/.gradle/wrapper and ~/.gradle/caches between
      # runs, which is hardening rather than a speed-up: this job's only two
      # failures were both fetches from other people's servers before a line of
      # the app was compiled — a 429 from Maven Central on a docs-only commit,
      # and a dropped connection while the wrapper downloaded Gradle itself. A
      # cache hit skips both.
      #
      # It narrows the window rather than closing it. A cold cache still
      # fetches, and the cache is cold whenever a Gradle file changes (the key
      # hashes them), or after seven days without a hit, or when the
      # repository's cache allowance evicts it. What is left is a rare flake
      # instead of a regular one, and re-running the job clears it.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app

      # The audience guard is tested before it is trusted. CI's verify job runs
      # the same self-test, but android-release.yml calls this workflow
      # directly without that job, and a release is where a guard that passes
      # vacuously costs the most.
      - name: Test the quiz audience check
        run: tool/check_quiz_audience.sh --self-test

      # The signing key, from repository secrets, written where Gradle looks for
      # it: app/android/key.properties and the keystore beside it, both
      # gitignored and both on a runner that is thrown away afterwards.
      #
      # Why this matters beyond the store release: Android identifies an app by
      # its package name and its signing certificate together, and refuses an
      # update signed by a different certificate. The debug key is generated per
      # machine, so every runner signed with a different one and no two builds
      # from this workflow could be installed over each other — the device asked
      # for an uninstall first, which throws the saved puzzles away. One key held
      # in secrets makes every build an update of the last.
      #
      # Absent, the build falls back to the debug key rather than failing, so a
      # fork — which is handed no secrets — still produces an installable APK.
      # Half-present is a hard failure: three secrets out of four would sign with
      # the debug key and look exactly like success, which is this bug again.
      - name: Write the signing config from secrets
        id: signing
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Spelled as an `if` rather than `[ -n "$v" ] && present=...`, whose
          # exit status is the test's: under `set -e` that reads like a script
          # that aborts as soon as one secret is unset, and survives only
          # because of an exemption for && lists. Not worth the second look.
          present=0
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -n "$value" ]; then
              present=$((present + 1))
            fi
          done

          if [ "$present" -eq 0 ]; then
            echo 'key=debug' >> "$GITHUB_OUTPUT"
            echo 'No signing secrets set — building with the debug key.'
            echo 'Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,' \
                 'ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to sign with a stable key.'
            exit 0
          fi

          if [ "$present" -ne 4 ]; then
            echo "Signing is half-configured: $present of the 4 secrets are set." >&2
            echo 'Set all of ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,' \
                 'ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD, or none of them.' >&2
            exit 1
          fi

          # `base64 --decode` tolerates the line wrapping that `base64` adds by
          # default, so the secret can have been produced either way.
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

          # Fail here, with a sentence, rather than inside a Gradle stack trace
          # forty steps later. `-certreq` rather than `-list` because it needs
          # the private key, so it exercises all four secrets — `-list` never
          # touches the key password, leaving the one wrong secret that still
          # reaches Gradle. The CSR it prints is thrown away; only the exit code
          # matters, and both streams go to /dev/null because a wrong password
          # is the message and a right one is not worth risking in a log.
          if ! keytool -certreq -keystore upload-keystore.jks \
                 -storepass "$KEYSTORE_PASSWORD" \
                 -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" > /dev/null 2>&1; then
            echo 'The keystore did not open with these secrets.' >&2
            echo 'Check that ANDROID_KEYSTORE_BASE64 decodes to the keystore, that the two' \
                 'passwords are right, and that ANDROID_KEY_ALIAS names a key in it.' >&2
            exit 1
          fi

          # storeFile is relative to app/android/, which is where Gradle resolves
          # it from. Written with printf rather than a heredoc so nothing here
          # expands a password into the job's shell trace.
          printf 'storeFile=%s\n' 'upload-keystore.jks' >  key.properties
          printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD" >> key.properties
          printf 'keyAlias=%s\n' "$KEY_ALIAS"              >> key.properties
          printf 'keyPassword=%s\n' "$KEY_PASSWORD"        >> key.properties
          chmod 600 key.properties upload-keystore.jks

          echo 'key=release' >> "$GITHUB_OUTPUT"
          echo 'Signing with the keystore from repository secrets.'

      # Release, not debug: the debug manifest adds INTERNET for hot reload, and
      # it is the release artifact whose permissions are the promise.
      #
      # Both flavours are built before the signing material is removed, because
      # both must be signed. `--flavor` is required: with product flavours the
      # Flutter tool looks for the unsuffixed release APK, which no longer exists.
      #
      # Signed with the key written above when there is one, and with Flutter's
      # debug key otherwise — app/android/app/build.gradle.kts decides, from
      # whether key.properties exists. A store release still needs the rest of
      # Phase 6 (PLAN.md §7); this only fixes installing one build over another.
      #
      # tool/build_defines.sh stamps the build with pubspec's version and the
      # time it was compiled, which the settings screen's footer reports
      # (app/lib/core/build_info.dart). Unquoted so the two flags it prints
      # become two arguments; neither value contains a space. A build without
      # it is not stamped and says "Development build", which is what a local
      # `flutter build apk` gives you — deliberately, since the alternative is
      # a fallback version in the source that goes stale without anyone
      # noticing.
      #
      # build_defines.sh stamps the time of each call, so the two APKs differ by
      # a few minutes in the footer; that is harmless.
      - name: Build the store APK
        run: flutter build apk --release --flavor store $(../tool/build_defines.sh)
        working-directory: app

      - name: Build the private APK
        run: flutter build apk --release --flavor private $(../tool/build_defines.sh)
        working-directory: app

      # Deleted as soon as the build no longer needs it, and on failure too. The
      # runner is discarded either way, so this is defence in depth against a
      # later step — one added in a hurry, or one from an action — reading the
      # workspace and printing what it finds.
      - name: Remove the signing material
        if: always()
        run: rm -f app/android/key.properties app/android/upload-keystore.jks

      # Belt and braces: tool/check_offline.dart reads the manifest source, this
      # reads the built package. Release checklist item — see PLAN.md §9.
      - name: Assert the APKs request no platform permissions
        run: |
          set -euo pipefail
          tool/check_apk_permissions.sh app/build/app/outputs/flutter-apk/app-store-release.apk
          tool/check_apk_permissions.sh app/build/app/outputs/flutter-apk/app-private-release.apk

      # Which quiz packs each package carries, read back from the package. The
      # two negatives are permanent rather than one-off evidence: the store APK
      # must fail private mode and the private APK must fail store mode on every
      # run. A flavour mechanism that quietly stopped bundling the private
      # packs would still pass the store check, and one that bundled them into
      # the store build would pass the private check; only both directions
      # together show that the two builds really differ, and a regression in
      # either is caught on the run that introduces it rather than at release.
      - name: Assert which quiz packs each APK carries
        run: |
          set -euo pipefail
          out=app/build/app/outputs/flutter-apk
          tool/check_quiz_audience.sh "$out/app-store-release.apk" store
          tool/check_quiz_audience.sh "$out/app-private-release.apk" private
          if tool/check_quiz_audience.sh "$out/app-store-release.apk" private; then
            echo 'The store APK passed private mode: both builds are the same.' >&2
            exit 1
          fi
          if tool/check_quiz_audience.sh "$out/app-private-release.apk" store; then
            echo 'The private APK passed store mode: it would leak the private packs.' >&2
            exit 1
          fi

      # One app, one save (PLAN-phase-10-quiz.md §4.9): the two builds must
      # share package name and label, or a tablet would hold two apps. The
      # private version code is the store's plus 50,000, so the private build
      # always outranks the store build of the same commit and every earlier
      # release; a drift in either number is caught here.
      - name: Assert the two APKs are one app with the expected version codes
        id: identity
        run: |
          set -euo pipefail
          aapt=$(tool/android_sdk_tool.sh aapt2)
          out=app/build/app/outputs/flutter-apk

          badging() {
            "$aapt" dump badging "$1" > "$RUNNER_TEMP/badging.txt"
            package=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt" | head -1)
            code=$(sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt" | head -1)
            label=$(sed -n "s/^application-label:'\(.*\)'$/\1/p" "$RUNNER_TEMP/badging.txt" | head -1)
          }

          badging "$out/app-store-release.apk"
          store_package=$package store_code=$code store_label=$label
          badging "$out/app-private-release.apk"
          private_package=$package private_code=$code private_label=$label

          echo "store:   $store_package, versionCode $store_code, label '$store_label'"
          echo "private: $private_package, versionCode $private_code, label '$private_label'"

          {
            echo '## Identity of the two builds'
            echo
            echo '| | Store | Private |'
            echo '|---|---|---|'
            echo "| Package | \`$store_package\` | \`$private_package\` |"
            echo "| Version code | \`$store_code\` | \`$private_code\` |"
            echo "| Label | $store_label | $private_label |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$store_package" ] || [ -z "$store_code" ] || [ -z "$store_label" ]; then
            echo 'Could not read the store APK badging.' >&2
            exit 1
          fi
          if [ "$store_package" != "$private_package" ]; then
            echo 'The two APKs have different package names.' >&2
            exit 1
          fi
          if [ "$store_label" != "$private_label" ]; then
            echo 'The two APKs have different labels.' >&2
            exit 1
          fi
          if [ "$private_code" != "$((store_code + 50000))" ]; then
            echo "The private version code is $private_code, not $store_code + 50000." >&2
            exit 1
          fi

      # Which certificate actually signed the package, read back from the
      # package rather than assumed from the secrets. It answers the one
      # question a failed install raises — "why will this not go over the build
      # I already have" — since Android accepts an update only from the same
      # certificate. Two runs are interchangeable on a device exactly when this
      # fingerprint matches, so it is worth having on the page.
      - name: Report the signing certificate
        id: cert
        run: |
          set -euo pipefail
          tool/apk_signing_cert.sh app/build/app/outputs/flutter-apk/app-store-release.apk |
            tee "$RUNNER_TEMP/signing.txt"
          sha=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signing.txt" | head -1)
          echo "sha256=${sha:-unknown}" >> "$GITHUB_OUTPUT"

      # Named after what it contains, since a downloaded app-store-release.apk tells
      # you nothing about which build it came from. The version is pubspec's, so
      # the file name matches the version the app reports.
      #
      # The store artifact keeps the plain name, because android-release.yml
      # attaches whatever the `apk` output names and must never be handed the
      # private build. The private one gets a suffix and its own artifact below.
      - name: Name the APK after its version and commit
        id: apk
        env:
          SIGNING_KEY: ${{ steps.signing.outputs.key }}
          SIGNING_SHA256: ${{ steps.cert.outputs.sha256 }}
          # A workflow_call run has no inputs, so this is empty there and the
          # comparison below is false, which is the safe direction.
          UPLOAD_PRIVATE: ${{ github.event_name == 'workflow_dispatch' && inputs.private }}
        run: |
          version=$(sed -n 's/^version: *//p' app/pubspec.yaml | head -1)
          name="game-station-${version/+/-build}-${GITHUB_SHA::7}"
          cp app/build/app/outputs/flutter-apk/app-store-release.apk "$RUNNER_TEMP/$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/$name.apk" >> "$GITHUB_OUTPUT"

          private_name="$name-private"
          cp app/build/app/outputs/flutter-apk/app-private-release.apk "$RUNNER_TEMP/$private_name.apk"
          echo "private_name=$private_name" >> "$GITHUB_OUTPUT"
          echo "private_path=$RUNNER_TEMP/$private_name.apk" >> "$GITHUB_OUTPUT"

          size=$(du -h "$RUNNER_TEMP/$name.apk" | cut -f1)
          if [ "$SIGNING_KEY" = 'release' ]; then
            key='repository signing key'
          else
            key='Flutter debug key — generated per machine'
          fi
          {
            echo "## $name.apk"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$version\` (pubspec) |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Size | $size |"
            echo "| Permissions | none, asserted against the package |"
            echo "| Signed with | $key |"
            echo "| Certificate | \`$SIGNING_SHA256\` |"
            echo
            echo 'Download it from **Artifacts** below, then install with'
            echo '`adb install -r <file>.apk`, or copy it to the device and open it.'
            echo
            if [ "$SIGNING_KEY" = 'release' ]; then
              echo 'It installs over any other build carrying the same certificate, keeping'
              echo 'saved puzzles. Android still warns about an unknown source, and a store'
              echo 'release needs the rest of Phase 6.'
            else
              echo '**No signing secrets are set, so this build used the debug key, which is'
              echo 'different on every machine.** It will not install over a build from another'
              echo 'run — Android will ask for an uninstall first, which discards saved puzzles.'
              echo 'See the README on setting `ANDROID_KEYSTORE_BASE64` and friends.'
            fi
            if [ "$UPLOAD_PRIVATE" = 'true' ]; then
              echo
              echo "The private APK is also uploaded, as \`$private_name\`. It is for Amazon"
              echo 'Live App Testing only and **must not be published** — not on a release'
              echo 'page, not in a store. It carries the private quiz packs. On this public'
              echo 'repository any signed-in GitHub user can download an Actions artifact,'
              echo 'which the owner accepted (PLAN-phase-10-quiz.md §4.9).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Fourteen days rather than the default ninety: CI runs this on every pull
      # request, and a ~20 MB package per run is not worth three months of it.
      # A build that matters outlives the retention by being downloaded.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # Only on a manual run that ticked `private`. CI and the release workflow
      # build the private APK to check it, but never keep it: the store APK is
      # what travels, and the private one has to be asked for by name.
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && inputs.private
        with:
          name: ${{ steps.apk.outputs.private_name }}
          path: ${{ steps.apk.outputs.private_path }}
          if-no-files-found: error
          retention-days: 14

      # TEMPORARY — PLAN-phase-10-quiz.md §4.9 asks PR 3 to record what an
      # unflagged Android build does. Reverted in the next commit.
      - name: Probe an unflagged build
        working-directory: app
        run: |
          set +e
          rm -f build/app/outputs/flutter-apk/*.apk
          flutter build apk --release
          echo "PROBE exit status: $?"
          echo 'PROBE flutter-apk outputs:'
          ls -la build/app/outputs/flutter-apk/
          for f in build/app/outputs/flutter-apk/*.apk; do
            [ -e "$f" ] || continue
            echo "PROBE $f private entries: $(unzip -Z1 "$f" | grep -c 'flutter_assets/assets/quiz/private/')"
          done
          exit 0
