name: Android release APK

# Attaches the APK to a published GitHub release, so the download lives on the
# release page rather than as an Actions artifact behind a login and a 14-day
# expiry. It builds from the release's tag rather than reusing an earlier run:
# the package on a release should be reproducible from the tag it claims.
#
# Separate from android-apk.yml because attaching needs `contents: write`, and a
# called workflow may only narrow the caller's token, never widen it. Keeping
# the write here means CI can go on calling the build with a read-only token.
on:
  release:
    types: [published]
  # Re-attach without re-publishing — an upload that failed, or a release made
  # before this workflow existed. Run it from the release's tag, not a branch:
  # the tag is both what gets built and where the APK is attached.
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  # The same build CI runs, from the tag. Inherits this workflow's default
  # read-only token, since it writes nothing back; the signing secrets are
  # handed over one by one, because a called workflow sees only what it is
  # given. This is the build that ends up on the release page, so it is the one
  # that most needs the stable key — a release APK that will not install over
  # the previous release is the whole complaint.
  build:
    name: Build
    uses: ./.github/workflows/android-apk.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  attach:
    name: Attach to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A dispatch from a branch would build that branch and attach it to
      # whatever release happens to share the name — fail instead of guessing.
      - name: Check the run is from a tag
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        run: |
          echo "Run this workflow from a release tag, not ${GITHUB_REF_NAME}." >&2
          exit 1

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.apk }}
          path: dist

      # --clobber so a re-run replaces the asset rather than failing on the
      # name; the tag is fixed, so the APK it names is the only one that can be
      # right. `gh` is preinstalled on the runner and needs no extra action.
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          gh release upload "$TAG" dist/*.apk --clobber --repo "$GITHUB_REPOSITORY"
          echo "Attached to release $TAG:"
          ls -lh dist

          {
            echo "## Attached to [$TAG](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
            echo
            for f in dist/*.apk; do
              echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"
            done
          } >> "$GITHUB_STEP_SUMMARY"
